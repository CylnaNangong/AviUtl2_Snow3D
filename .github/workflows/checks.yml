name: checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check package contents, versions and reproducibility
        run: python3 -m unittest discover -s tests -v
      - name: Build installation package
        run: python3 packaging/build_au2pkg.py --out-dir dist
